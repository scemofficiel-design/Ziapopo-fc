<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ZIAPOPO FC — Manager</title>
<meta name="theme-color" content="#0A0D12" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#07090C; --surface:#12161D; --surface2:#1A1F28;
  --border:#232A35; --text:#EDEFF3; --muted:#8B93A1; --muted2:#6B7380;
  --green:#1FE08A; --green-dk:#0B7A48; --gold:#D4AF37; --red:#FF5D6C; --blue:#4C8DFF;
}
#globalErrorBanner{position:fixed;top:0;left:0;right:0;z-index:9999;background:#3A1015;border-bottom:1px solid var(--red);color:#FFD5D8;font-size:12px;font-family:monospace;padding:10px 14px;white-space:pre-wrap;word-break:break-word;display:none;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(1200px 600px at 50% -10%, #131B18 0%, #090B0F 55%, #07090C 100%);
  color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; padding-bottom:84px;
}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
button{cursor:pointer;font-family:'Inter',sans-serif;}
input,select,textarea{font-family:'Inter',sans-serif;}
button:focus-visible, input:focus-visible, select:focus-visible{outline:2px solid var(--green); outline-offset:1px;}
a{color:inherit;}

.header{
  position:sticky; top:0; z-index:20; backdrop-filter:blur(10px);
  background:rgba(9,11,15,0.85); border-bottom:1px solid #1C2128;
  padding:14px 16px; display:flex; align-items:center; justify-content:space-between;
}
.header-left{display:flex; align-items:center; gap:10px;}
.logo{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg,var(--green),var(--green-dk));
  display:flex;align-items:center;justify-content:center; color:#06120B; font-weight:700; flex-shrink:0;
}
.club-name{font-family:'Oswald',sans-serif; font-weight:600; font-size:18px; letter-spacing:.3px; cursor:pointer;}
.club-name-input{
  background:#161B22;border:1px solid var(--border);border-radius:8px;color:var(--text);
  font-family:'Oswald',sans-serif;font-size:16px;padding:4px 8px;width:160px;
}
.pill{font-size:11px;font-weight:600;letter-spacing:.3px;padding:3px 9px;border-radius:999px;white-space:nowrap;display:inline-block;}

main{max-width:720px;margin:0 auto;padding:16px 14px 0;}

.card{background:var(--surface); border:1px solid var(--border); border-radius:14px;}
.card-pad{padding:16px;}
.card-pad-sm{padding:12px;}

.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted2);margin-bottom:6px;}

.btn-primary{
  font-weight:600;font-size:14px;color:#06120B;
  background:linear-gradient(135deg,#1FE08A,#0FAE68); border:none;border-radius:10px;
  padding:11px 16px; display:flex; align-items:center; justify-content:center; gap:6px; width:100%;
}
.btn-primary:disabled{background:#2A6B4D; cursor:not-allowed;}
.btn-ghost{
  font-weight:600;font-size:13px;color:#C7CCD4; background:var(--surface2);
  border:1px solid #2A313D; border-radius:10px; padding:9px 14px; display:flex; align-items:center; justify-content:center; gap:6px;
}
.btn-icon{background:var(--surface2);border:none;border-radius:8px;padding:8px;color:#C7CCD4;display:flex;align-items:center;justify-content:center;}
.btn-row{display:flex; gap:8px;}

.input{
  width:100%; background:#0E1216; border:1px solid var(--border); border-radius:9px;
  color:var(--text); padding:10px 12px; font-size:14px;
}
.field{margin-bottom:12px;}
.field-label{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}

.stack{display:flex;flex-direction:column;gap:12px;}
.stack-sm{display:flex;flex-direction:column;gap:8px;}

.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;}
.chip{
  flex-shrink:0; font-size:12px; font-weight:600; padding:6px 12px; border-radius:999px;
  border:1px solid var(--border); background:var(--surface); color:#C7CCD4;
}
.chip.active{background:var(--green); color:#06120B; border-color:transparent;}
.chip-lg{font-family:'Oswald',sans-serif; font-size:13px; padding:8px 14px; border-radius:10px;}

.stat-value{font-family:'Oswald',sans-serif; font-weight:700; font-size:30px;}
.stat-value-sm{font-family:'Oswald',sans-serif; font-weight:700; font-size:24px;}
.stat-sub{color:var(--muted2); font-size:12px; margin-top:2px;}

.row-card{padding:12px; display:flex; align-items:center; gap:12px;}
.avatar{
  width:42px;height:42px;border-radius:10px;background:var(--surface2);
  display:flex;align-items:center;justify-content:center; font-family:'Oswald',sans-serif;
  font-weight:700;font-size:14px;color:var(--green); flex-shrink:0;
}
.row-title{font-weight:600;font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.row-tags{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;}

.bottom-nav{
  position:fixed; bottom:0; left:0; right:0; z-index:30;
  background:rgba(11,14,18,0.94); backdrop-filter:blur(10px); border-top:1px solid #1C2128;
  display:flex; justify-content:space-around; padding:8px 4px calc(8px + env(safe-area-inset-bottom));
}
.nav-btn{
  background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:4px 4px;color:var(--muted2); flex:1; min-width:0;
}
.nav-btn.active{color:var(--green);}
.nav-btn svg{width:20px;height:20px;flex-shrink:0;}
.nav-label{font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}

.modal-overlay{
  position:fixed; inset:0; background:rgba(4,6,8,0.72); backdrop-filter:blur(3px); z-index:50;
  display:flex; align-items:flex-end; justify-content:center;
}
.modal-sheet{
  width:100%; max-width:480px; max-height:88vh; overflow-y:auto; background:var(--surface);
  border-top:1px solid #2A313D; border-top-left-radius:18px; border-top-right-radius:18px;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));
}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.modal-title{font-family:'Oswald',sans-serif;font-size:18px;font-weight:600;}

.pitch{
  position:relative; width:100%; aspect-ratio:0.8;
  background:linear-gradient(180deg,#123322,#0E2A1B); border-radius:12px; border:1px solid #1E4531; overflow:hidden;
}
.pitch-border{position:absolute; inset:14px; border:1.5px solid rgba(255,255,255,0.18); border-radius:4px;}
.pitch-circle{
  position:absolute; left:50%; top:50%; width:90px; height:90px;
  border:1.5px solid rgba(255,255,255,0.18); border-radius:50%; transform:translate(-50%,-50%);
}
.slot-btn{
  position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column;
  align-items:center; gap:3px; background:none; border:none;
}
.slot-dot{
  width:40px;height:40px;border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:'Oswald',sans-serif; font-weight:700; font-size:12px;
}
.slot-dot.filled{background:var(--green); border:2px solid var(--green-dk); color:#06120B;}
.slot-dot.empty{background:rgba(255,255,255,0.1); border:1.5px dashed rgba(255,255,255,0.35); color:rgba(255,255,255,0.6);}
.slot-name{
  font-size:10px;font-weight:600;color:var(--text); background:rgba(0,0,0,0.55); padding:1px 5px;
  border-radius:5px; max-width:68px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

.form-row{display:flex; align-items:center; gap:8px;}
.search-wrap{position:relative; flex:1;}
.search-icon{position:absolute; left:10px; top:11px; color:var(--muted2);}
.search-input{padding-left:32px;}

.checkbox-row{display:flex; align-items:center; gap:8px; font-size:13px; color:#C7CCD4; margin-bottom:16px;}

.empty-card{padding:24px; text-align:center; color:var(--muted2); font-size:14px;}
.loading{text-align:center; padding:60px 0; color:var(--muted2);}

.section-head{display:flex;align-items:center;gap:10px;margin-bottom:2px;}
.section-title{font-family:'Oswald',sans-serif;font-size:20px;font-weight:600;}

.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.menu-tile{
  background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px;
  display:flex; flex-direction:column; gap:10px; align-items:flex-start; text-align:left;
}
.menu-tile-icon{
  width:38px;height:38px;border-radius:10px;background:rgba(31,224,138,0.12);color:var(--green);
  display:flex;align-items:center;justify-content:center;
}
.menu-tile-icon svg{width:19px;height:19px;}
.menu-tile-label{font-weight:600;font-size:14px;}
.menu-tile-sub{color:var(--muted2);font-size:11px;}

.day-group-label{font-size:12px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.6px;margin:6px 0 -2px 2px;}

canvas.chart-canvas{max-height:180px;}
</style>
</head>

// Filet de sécurité : affiche toute erreur JS (à tout moment, pas seulement au
// démarrage) dans un bandeau visible, au lieu d'un plantage silencieux invisible.
function showGlobalError(message) {
  const banner = document.getElementById("globalErrorBanner");
  if (!banner) return;
  banner.textContent = "Erreur : " + message + " — fais une capture d'écran et envoie-la.";
  banner.style.display = "block";
}
window.addEventListener("error", (e) => showGlobalError(e.message || String(e.error)));
window.addEventListener("unhandledrejection", (e) => showGlobalError((e.reason && e.reason.message) || String(e.reason)));

// Nettoyage défensif : désinstalle tout ancien service worker / cache
// laissé par une version précédente de l'appli.
if ("serviceWorker" in navigator) {

}
if (window.caches) {
  caches.keys().then((keys) => keys.forEach((k) => caches.delete(k))).catch(() => {});
}

const PLUS_CHILD_KEYS = PLUS_ITEMS.map((i) => i.key);

/* ---------------------------- State ---------------------------- */

function loadState() {
  const fallback = {
    clubName: "ZIAPOPO FC",
    players: [],
    compositions: [],
    matches: [],
    championships: [],
    editions: [],
    stats: {},
    events: [],
    attendance: {},
    trials: [],
    adminLog: [],
    responsables: [],
    tab: "dashboard",
  };
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return fallback;
    return { ...fallback, ...JSON.parse(raw) };
  } catch (e) {
    console.error("Erreur de lecture du stockage", e);
    return fallback;
  }
}

let STATE = loadState();

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
  } catch (e) {
    console.error("Erreur de sauvegarde", e);
  }
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

/* ---------------------------- Helpers ---------------------------- */

function esc(str) {
  if (str === undefined || str === null) return "";
  return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function matchResult(score) {
  if (!score || !score.includes("-")) return null;
  const [a, b] = score.split("-").map((s) => parseInt(s.trim(), 10));
  if (isNaN(a) || isNaN(b)) return null;
  if (a > b) return "V";
  if (a < b) return "D";
  return "N";
}

function formatDate(d) {
  if (!d) return "";
  try {
    return new Date(d).toLocaleString("fr-FR", { weekday: "short", day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
  } catch { return d; }
}
function formatDateShort(d) {
  if (!d) return "";
  try { return new Date(d).toLocaleDateString("fr-FR", { day: "2-digit", month: "short", year: "numeric" }); } catch { return d; }
}
function truncate(str, n) {
  if (!str) return "";
  return str.length > n ? str.slice(0, n - 1) + "…" : str;
}
function playerName(id) {
  const p = STATE.players.find((x) => x.id === id);
  return p ? p.pseudo : "—";
}

/* ---------------------------- Render root ---------------------------- */

function render() {
  renderHeader();
  renderBottomNav();
  const view = document.getElementById("view");
  const renderers = {
    dashboard: renderDashboard,
    effectif: renderEffectif,
    compos: renderCompositions,
    matchs: renderMatchs,
    plus: renderPlusMenu,
    stats: renderStatistiques,
    calendrier: renderCalendrier,
    presences: renderPresences,
    recrutement: renderRecrutement,
    administration: renderAdministration,
    parametres: renderParametres,
  };
  const fn = renderers[STATE.tab] || renderDashboard;
  view.innerHTML = fn();
  attachViewHandlers();
}

function setTab(tab) {
  STATE.tab = tab;
  saveState();
  render();
}

function backButton(label) {
  return `<div class="section-head">
    <button class="btn-icon" id="backToPlus">${ICONS.back}</button>
    <div class="section-title">${esc(label)}</div>
  </div>`;
}

/* ---------------------------- Header ---------------------------- */

  zone.innerHTML = `<div class="club-name" id="clubNameDisplay" title="Toucher pour renommer le club">${esc(STATE.clubName)}</div>`;
  document.getElementById("clubNameDisplay").addEventListener("click", () => {

/* ---------------------------- Dashboard ---------------------------- */

function renderDashboard() {
  const { players, matches, compositions, clubName } = STATE;
  const sorted = [...matches].sort((a, b) => new Date(a.date) - new Date(b.date));
  const now = new Date();
  const next = sorted.find((m) => m.date && new Date(m.date) >= now && !m.score);
  const played = [...matches].filter((m) => m.score).sort((a, b) => new Date(b.date) - new Date(a.date));
  const last = played[0];
  const last5 = played.slice(0, 5);
  const record = played.reduce((acc, m) => {
    const r = matchResult(m.score);
    if (r === "V") acc.v++; else if (r === "N") acc.n++; else if (r === "D") acc.d++;
    return acc;
  }, { v: 0, n: 0, d: 0 });
  const dispo = players.filter((p) => p.dispo !== false).length;
  const indispo = players.length - dispo;

  return `
  <div class="stack">
    <div class="grid2">
      <div class="card card-pad">
        <div class="eyebrow">Effectif</div>
        <div class="stat-value">${players.length}</div>
        <div class="stat-sub">joueurs enregistrés</div>
      </div>
      <div class="card card-pad">
        <div class="eyebrow">Disponibles</div>
        <div class="stat-value" style="color:var(--green);">${dispo}</div>
        <div class="stat-sub">${indispo} indisponible(s)</div>
      </div>
    </div>
    <div class="card card-pad">
      <div class="eyebrow">Prochain rendez-vous</div>
      ${next ? `
        <div style="font-family:'Oswald',sans-serif;font-size:22px;font-weight:600;">${esc(clubName)} vs ${esc(next.adversaire || "?")}</div>
        <div style="color:var(--muted);font-size:13px;margin-top:4px;">${formatDate(next.date)} ${next.competition ? "· " + esc(next.competition) : ""}</div>
      ` : `<div style="color:var(--muted2);font-size:14px;">Aucun match programmé. Ajoute-le dans l'onglet Matchs.</div>`}
    </div>
    <div class="card card-pad">
      <div class="eyebrow">Forme actuelle (5 derniers)</div>
      ${last5.length === 0 ? `<div style="color:var(--muted2);font-size:14px;">Pas encore de résultat enregistré.</div>` : `
        <div style="display:flex;gap:8px;margin-top:4px;">
          ${last5.map((m) => {
            const r = matchResult(m.score);
            const c = r === "V" ? "var(--green)" : r === "D" ? "var(--red)" : "var(--gold)";
            return `<div title="${esc(m.adversaire || "?")} · ${esc(m.score || "")}" style="width:30px;height:30px;border-radius:8px;background:${c}22;color:${c};display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Oswald',sans-serif;font-size:13px;">${r}</div>`;
          }).join("")}
        </div>`}
    </div>
    <div class="grid3">
      <div class="card card-pad-sm"><div class="eyebrow">Victoires</div><div class="stat-value-sm" style="color:var(--green);">${record.v}</div></div>
      <div class="card card-pad-sm"><div class="eyebrow">Nuls</div><div class="stat-value-sm" style="color:var(--gold);">${record.n}</div></div>
      <div class="card card-pad-sm"><div class="eyebrow">Défaites</div><div class="stat-value-sm" style="color:var(--red);">${record.d}</div></div>
    </div>
    ${last ? `<div class="card card-pad"><div class="eyebrow">Dernier résultat</div><div style="font-family:'Oswald',sans-serif;font-size:18px;font-weight:600;">${esc(clubName)} ${esc(last.score)} ${esc(last.adversaire)}</div></div>` : ""}
    <div class="card card-pad"><div class="eyebrow">Compositions enregistrées</div><div style="font-family:'Oswald',sans-serif;font-size:18px;font-weight:600;">${compositions.length} composition${compositions.length > 1 ? "s" : ""}</div></div>
  </div>`;
}

function generateVisual() {
  const canvas = document.getElementById("compoCanvas");
  const W = 1000, H = 1250;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  const { players, clubName } = STATE;
  const layout = FORMATIONS[compoFormation];

  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "#0E1520"); bg.addColorStop(1, "#070A0D");
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = "#1FE08A"; ctx.font = "700 22px Oswald, sans-serif"; ctx.textAlign = "center";
  ctx.fillText("COMPOSITION OFFICIELLE", W / 2, 60);
  ctx.fillStyle = "#EDEFF3"; ctx.font = "700 42px Oswald, sans-serif";
  ctx.fillText(clubName.toUpperCase(), W / 2, 108);
  ctx.fillStyle = "#8B93A1"; ctx.font = "500 20px Inter, sans-serif";
  ctx.fillText(`Formation ${compoFormation} — ${compoName || "Sans nom"}`, W / 2, 138);

  const pitchX = 60, pitchY = 170, pitchW = W - 120, pitchH = 980;
  ctx.fillStyle = "#123322";
  roundRect(ctx, pitchX, pitchY, pitchW, pitchH, 18); ctx.fill();
  ctx.save(); ctx.clip();
  for (let i = 0; i < 10; i++) {
    ctx.fillStyle = i % 2 === 0 ? "rgba(255,255,255,0.02)" : "rgba(0,0,0,0.05)";
    ctx.fillRect(pitchX, pitchY + (pitchH / 10) * i, pitchW, pitchH / 10);
  }
  ctx.restore();
  ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = 2;
  ctx.strokeRect(pitchX + 20, pitchY + 20, pitchW - 40, pitchH - 40);
  ctx.beginPath(); ctx.arc(W / 2, pitchY + pitchH / 2, 90, 0, Math.PI * 2); ctx.stroke();

  layout.forEach((slot) => {
    const px = pitchX + (slot.x / 100) * pitchW;
    const py = pitchY + (slot.y / 100) * pitchH;
    const player = players.find((p) => p.id === compoSlots[slot.key]);
    ctx.beginPath(); ctx.arc(px, py, 34, 0, Math.PI * 2);
    ctx.fillStyle = player ? "#1FE08A" : "rgba(255,255,255,0.08)"; ctx.fill();
    ctx.textAlign = "center";
    if (player) { ctx.fillStyle = "#06120B"; ctx.font = "700 20px Oswald, sans-serif"; ctx.fillText(slot.label, px, py + 7); }
    else { ctx.fillStyle = "rgba(255,255,255,0.4)"; ctx.font = "600 15px Inter, sans-serif"; ctx.fillText(slot.label, px, py + 5); }
    ctx.fillStyle = "#EDEFF3"; ctx.font = "700 17px Inter, sans-serif";
    ctx.fillText(truncate(player ? player.pseudo : "—", 16), px, py + 56);
  });

  ctx.textAlign = "left"; ctx.fillStyle = "#4C5560"; ctx.font = "500 14px Inter, sans-serif";
  ctx.fillText(`Généré le ${new Date().toLocaleDateString("fr-FR")}`, pitchX, H - 20);

  const url = canvas.toDataURL("image/png");
  const a = document.createElement("a");
  a.href = url; a.download = `${(compoName || "composition").replace(/\s+/g, "_")}.png`;
  a.click();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

/* ---------------------------- Statistiques ---------------------------- */

let statsActiveChampionship = null;
let statsActiveEdition = null;
let charts = { scorers: null, assists: null, keepers: null };

function statKey(champId, editionId, playerId) { return `${champId}::${editionId}::${playerId}`; }
function getStat(champId, editionId, playerId) { return STATE.stats[statKey(champId, editionId, playerId)] || { buts: 0, passes: 0, cleanSheets: 0 }; }
function setStatField(champId, editionId, playerId, field, value) {
  const key = statKey(champId, editionId, playerId);
  const current = STATE.stats[key] || { buts: 0, passes: 0, cleanSheets: 0 };
  const num = Math.max(0, parseInt(value, 10) || 0);
  STATE.stats[key] = { ...current, [field]: num };
  saveState();
}

function getStatsContext() {
  const { championships, editions, players } = STATE;
  if (!statsActiveChampionship || !championships.find((c) => c.id === statsActiveChampionship)) {
    statsActiveChampionship = championships[0] ? championships[0].id : null;
  }
  const champ = championships.find((c) => c.id === statsActiveChampionship) || null;
  const champEditions = champ ? editions.filter((e) => e.championshipId === champ.id) : [];
  if (!champ || !statsActiveEdition || !champEditions.find((e) => e.id === statsActiveEdition)) {
    statsActiveEdition = champEditions[0] ? champEditions[0].id : null;
  }
  const edition = champEditions.find((e) => e.id === statsActiveEdition) || null;
  const rows = edition ? players.map((p) => ({ p, s: getStat(champ.id, edition.id, p.id) })) : [];
  const topScorers = [...rows].sort((a, b) => b.s.buts - a.s.buts).filter((r) => r.s.buts > 0).slice(0, 5);
  const topAssists = [...rows].sort((a, b) => b.s.passes - a.s.passes).filter((r) => r.s.passes > 0).slice(0, 5);
  const topKeepers = rows.filter((r) => r.p.poste === "GB").sort((a, b) => b.s.cleanSheets - a.s.cleanSheets).filter((r) => r.s.cleanSheets > 0).slice(0, 5);
  return { champ, champEditions, edition, rows, topScorers, topAssists, topKeepers };
}

function renderStatistiques() {
  const { championships } = STATE;
  const { champ, champEditions, edition, rows, topScorers, topAssists, topKeepers } = getStatsContext();

  return `
  <div class="stack">
    ${backButton("Statistiques")}
    ${championships.length === 0 ? `
      <div class="card empty-card">
        <div style="margin-bottom:12px;">Aucun championnat pour l'instant. Crée-en un pour commencer à suivre les statistiques.</div>
        <button class="btn-primary" id="addChampBtn">${ICONS.plus} Créer un championnat</button>
      </div>
    ` : `
    <div class="form-row">
      <div class="chip-row" style="flex:1;">
        ${championships.map((c) => `<button class="chip chip-lg champ-chip" data-id="${c.id}" style="${champ && champ.id === c.id ? "background:var(--green);color:#06120B;border-color:transparent;" : ""}">${esc(c.name)}</button>`).join("")}
      </div>
      <button class="btn-icon" id="addChampBtn" style="flex-shrink:0;" title="Nouveau championnat">${ICONS.plus}</button>
    </div>
    ${champ ? `
      <div class="form-row">
        <div class="chip-row" style="flex:1;">
          ${champEditions.length === 0 ? `<span style="color:var(--muted2);font-size:13px;">Aucune édition pour ${esc(champ.name)}.</span>` : champEditions.map((e) => `<button class="chip edition-chip" data-id="${e.id}" style="${edition && edition.id === e.id ? "background:var(--green);color:#06120B;border-color:transparent;" : ""}">${esc(e.name)}</button>`).join("")}
        </div>
        <button class="btn-icon" id="addEditionBtn" style="flex-shrink:0;" title="Nouvelle édition">${ICONS.plus}</button>
      </div>
      ${champEditions.length === 0 ? `<button class="btn-primary" id="addEditionBtnBig">${ICONS.plus} Créer une édition / saison</button>` : ""}
      <button class="btn-ghost delete-champ-btn" data-id="${champ.id}" style="align-self:flex-start;">${ICONS.trash} Supprimer ce championnat</button>
    ` : `<div class="card empty-card">Sélectionne un championnat ci-dessus.</div>`}
    `}

    ${champ && edition ? `
      ${(topScorers.length || topAssists.length || topKeepers.length) ? `
        <div class="card card-pad">
          <div class="eyebrow">Top buteurs</div>
          <canvas id="scorersChart" class="chart-canvas"></canvas>
        </div>
        <div class="card card-pad">
          <div class="eyebrow">Top passeurs</div>
          <canvas id="assistsChart" class="chart-canvas"></canvas>
        </div>
        ${topKeepers.length ? `
        <div class="card card-pad">
          <div class="eyebrow">Gardiens — Inviolabilité</div>
          <canvas id="keepersChart" class="chart-canvas"></canvas>
        </div>` : ""}
      ` : `<div class="card empty-card">Entre des statistiques ci-dessous pour voir apparaître les graphiques.</div>`}

      <div>
        <div class="eyebrow">${esc(champ.name)} — ${esc(edition.name)}</div>
        ${rows.length === 0 ? `<div class="card empty-card">Ajoute des joueurs dans l'onglet Effectif d'abord.</div>` : `
          <div class="stack-sm">
            ${rows.map(({ p, s }) => `
              <div class="card card-pad-sm">
                <div style="font-weight:600;font-size:14px;margin-bottom:8px;">${esc(p.pseudo)} <span style="color:var(--muted2);font-weight:500;font-size:12px;">(${esc(p.poste)})</span></div>
                <div class="grid3">
                  <div><div class="field-label">Buts</div><input class="input stat-input" type="number" min="0" inputmode="numeric" data-player="${p.id}" data-field="buts" value="${s.buts}" /></div>
                  <div><div class="field-label">Passes D.</div><input class="input stat-input" type="number" min="0" inputmode="numeric" data-player="${p.id}" data-field="passes" value="${s.passes}" /></div>
                  <div><div class="field-label">${p.poste === "GB" ? "Inviolabilité" : "Inviolabilité —"}</div><input class="input stat-input" type="number" min="0" inputmode="numeric" data-player="${p.id}" data-field="cleanSheets" value="${s.cleanSheets}" ${p.poste === "GB" ? "" : "disabled"} /></div>
                </div>
              </div>`).join("")}
          </div>`}
      </div>` : ""}
  </div>`;
}

function buildStatsCharts() {
  if (!window.Chart) return;
  const { topScorers, topAssists, topKeepers } = getStatsContext();
  Object.values(charts).forEach((c) => { if (c) c.destroy(); });
  charts = { scorers: null, assists: null, keepers: null };

  const baseOptions = {
    indexAxis: "y",
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: {
      x: { beginAtZero: true, ticks: { color: "#8B93A1", precision: 0 }, grid: { color: "#232A35" } },
      y: { ticks: { color: "#EDEFF3", font: { family: "Inter" } }, grid: { display: false } },
    },
  };

  const scorersEl = document.getElementById("scorersChart");
  if (scorersEl && topScorers.length) {
    charts.scorers = new Chart(scorersEl, {
      type: "bar",
      data: { labels: topScorers.map((r) => r.p.pseudo), datasets: [{ data: topScorers.map((r) => r.s.buts), backgroundColor: "#1FE08A", borderRadius: 6 }] },
      options: baseOptions,
    });
  }
  const assistsEl = document.getElementById("assistsChart");
  if (assistsEl && topAssists.length) {
    charts.assists = new Chart(assistsEl, {
      type: "bar",
      data: { labels: topAssists.map((r) => r.p.pseudo), datasets: [{ data: topAssists.map((r) => r.s.passes), backgroundColor: "#D4AF37", borderRadius: 6 }] },
      options: baseOptions,
    });
  }
  const keepersEl = document.getElementById("keepersChart");
  if (keepersEl && topKeepers.length) {
    charts.keepers = new Chart(keepersEl, {
      type: "bar",
      data: { labels: topKeepers.map((r) => r.p.pseudo), datasets: [{ data: topKeepers.map((r) => r.s.cleanSheets), backgroundColor: "#4C8DFF", borderRadius: 6 }] },
      options: baseOptions,
    });
  }
}

/* ---------------------------- Calendrier ---------------------------- */

function renderCalendrier() {
  const { events } = STATE;
  const sorted = [...events].sort((a, b) => new Date(a.date) - new Date(b.date));
  let lastDay = null;
  const rows = sorted.map((e) => {
    const day = formatDateShort(e.date);
    const header = day !== lastDay ? `<div class="day-group-label">${day}</div>` : "";
    lastDay = day;
    return header + renderEventRow(e);
  }).join("");

  return `
  <div class="stack">
    ${backButton("Calendrier")}
    <button class="btn-primary" id="addEventBtn">${ICONS.plus} Ajouter un événement</button>
    ${sorted.length === 0 ? `<div class="card empty-card">Aucun événement programmé.</div>` : `<div class="stack-sm">${rows}</div>`}
  </div>`;
}

function renderEventRow(e) {
  const typeColor = { "Entraînement": "#4C8DFF", "Match": "#1FE08A", "Réunion": "#D4AF37", "Événement": "#8B93A1" }[e.type] || "#8B93A1";

    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">

        <div style="color:var(--muted2);font-size:12px;margin-top:2px;">${formatDate(e.date)}</div>
        ${e.notes ? `<div style="color:var(--muted);font-size:13px;margin-top:4px;">${esc(e.notes)}</div>` : ""}
      </div>
      <div class="btn-row">
        <button class="btn-icon edit-event-btn" data-id="${e.id}">${ICONS.pencil}</button>

/* ---------------------------- Présences ---------------------------- */

let presenceActiveEventId = null;

function renderPresences() {
  const sessions = STATE.events.filter((e) => e.type === "Entraînement" || e.type === "Match").sort((a, b) => new Date(b.date) - new Date(a.date));
  if (!presenceActiveEventId || !sessions.find((s) => s.id === presenceActiveEventId)) {
    presenceActiveEventId = sessions[0] ? sessions[0].id : null;
  }
  const session = sessions.find((s) => s.id === presenceActiveEventId) || null;
  const { players } = STATE;

  const rates = players.map((p) => {
    let present = 0, total = 0;
    sessions.forEach((s) => {
      const rec = STATE.attendance[s.id];
      if (rec && rec[p.id]) { total++; if (rec[p.id] === "Présent") present++; }
    });
    return { p, rate: total ? Math.round((present / total) * 100) : null, total };
  }).filter((r) => r.total > 0).sort((a, b) => b.rate - a.rate);

  return `
  <div class="stack">
    ${backButton("Présences")}
    ${sessions.length === 0 ? `<div class="card empty-card">Ajoute d'abord un entraînement ou un match dans le Calendrier.</div>` : `
      <div class="chip-row">
        ${sessions.map((s) => `<button class="chip session-chip" data-id="${s.id}" style="${session && session.id === s.id ? "background:var(--green);color:#06120B;border-color:transparent;" : ""}">${formatDateShort(s.date)} · ${esc(s.title || s.type)}</button>`).join("")}
      </div>
      ${session ? `
        <div class="stack-sm">
          ${players.length === 0 ? `<div class="card empty-card">Ajoute des joueurs dans l'onglet Effectif d'abord.</div>` : players.map((p) => {
            const rec = (STATE.attendance[session.id] || {})[p.id] || null;
            return `
            <div class="card card-pad-sm" style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
              <div class="row-title">${esc(p.pseudo)}</div>
              <div class="chip-row" style="padding:0;">
                ${PRESENCE_STATUSES.map((st) => `<button class="chip presence-btn" data-player="${p.id}" data-status="${st}" style="${rec === st ? "background:var(--green);color:#06120B;border-color:transparent;" : ""}">${st}</button>`).join("")}
              </div>
            </div>`;
          }).join("")}
        </div>` : ""}
    `}
    ${rates.length > 0 ? `
      <div>
        <div class="eyebrow">Taux de présence</div>
        <div class="stack-sm">
          ${rates.map((r) => `<div class="card card-pad-sm" style="display:flex;justify-content:space-between;align-items:center;"><div class="row-title">${esc(r.p.pseudo)}</div><div style="font-family:'Oswald',sans-serif;font-weight:700;color:${r.rate >= 70 ? "var(--green)" : r.rate >= 40 ? "var(--gold)" : "var(--red)"};">${r.rate}%</div></div>`).join("")}
        </div>
      </div>` : ""}
  </div>`;
}

  `);
  const pseudoInput = document.getElementById("t_pseudo");
  const saveBtn = document.getElementById("saveTrialBtn");
  const toggleSave = () => { saveBtn.disabled = !pseudoInput.value.trim(); };
  pseudoInput.addEventListener("input", toggleSave);
  toggleSave();
  saveBtn.addEventListener("click", () => {
    const updated = {
      id: t.id, pseudo: pseudoInput.value.trim(),
      poste: document.getElementById("t_poste").value,
      niveau: document.getElementById("t_niveau").value,
      date: document.getElementById("t_date").value,
      matchs: parseInt(document.getElementById("t_matchs").value, 10) || 0,
      observations: document.getElementById("t_obs").value,
      decision: document.getElementById("t_decision").value,
    };
    if (!updated.pseudo) return;
    const idx = STATE.trials.findIndex((x) => x.id === t.id);
    if (idx >= 0) STATE.trials[idx] = updated; else STATE.trials.push(updated);
    saveState(); closeModal(); render();
  });
}

/* ---------------------------- Administration ---------------------------- */

function renderAdministration() {
  const log = [...STATE.adminLog].sort((a, b) => new Date(b.date) - new Date(a.date));
  return `
  <div class="stack">
    ${backButton("Administration")}
    <button class="btn-primary" id="addLogBtn">${ICONS.plus} Ajouter une entrée</button>
    ${log.length === 0 ? `<div class="card empty-card">Aucune entrée dans le journal du club.</div>` : `
      <div class="stack-sm">
        ${log.map((l) => `
          <div class="card card-pad-sm" data-log-id="${l.id}">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
              <div>
                <span class="pill" style="color:${LOG_COLOR[l.type]};background:${LOG_COLOR[l.type]}22;">${esc(l.type)}</span>
                ${l.player ? `<span class="pill" style="margin-left:4px;color:var(--muted);background:rgba(139,147,161,0.12);">${esc(playerName(l.player))}</span>` : ""}
                <div style="font-size:13px;margin-top:6px;">${esc(l.description)}</div>
                <div style="color:var(--muted2);font-size:12px;margin-top:2px;">${formatDateShort(l.date)}</div>
              </div>
              <button class="btn-icon delete-log-btn" data-id="${l.id}">${ICONS.trash}</button>
            </div>
          </div>`).join("")}
      </div>`}
  </div>`;
}

function openLogModal() {
  const { players } = STATE;
  showModal("Nouvelle entrée du journal", `
    <div class="field"><div class="field-label">Type</div><select class="input" id="l_type">${LOG_TYPES.map((t) => `<option value="${t}">${t}</option>`).join("")}</select></div>
    <div class="field"><div class="field-label">Joueur concerné (optionnel)</div><select class="input" id="l_player"><option value="">—</option>${players.map((p) => `<option value="${p.id}">${esc(p.pseudo)}</option>`).join("")}</select></div>
    <div class="field"><div class="field-label">Date</div><input class="input" type="date" id="l_date" value="${new Date().toISOString().slice(0, 10)}" /></div>
    <div class="field"><div class="field-label">Description</div><textarea class="input" id="l_desc" style="min-height:70px;" placeholder="Détail de la sanction, promotion, décision…"></textarea></div>
    <button class="btn-primary" id="saveLogBtn">Enregistrer</button>
  `);
  const descInput = document.getElementById("l_desc");
  const saveBtn = document.getElementById("saveLogBtn");
  const toggleSave = () => { saveBtn.disabled = !descInput.value.trim(); };
  descInput.addEventListener("input", toggleSave);
  toggleSave();
  saveBtn.addEventListener("click", () => {
    const entry = {
      id: uid(),
      type: document.getElementById("l_type").value,
      player: document.getElementById("l_player").value,
      date: document.getElementById("l_date").value,
      description: descInput.value.trim(),
    };
    if (!entry.description) return;
    STATE.adminLog.push(entry);
    saveState(); closeModal(); render();
  });
}

/* ---------------------------- Paramètres ---------------------------- */

function renderParametres() {
  const { responsables } = STATE;
  return `
  <div class="stack">
    ${backButton("Paramètres")}
    <div class="card card-pad">
      <div class="eyebrow">Nom du club</div>
      <div class="form-row">
        <input class="input" id="settingsClubName" value="${esc(STATE.clubName)}" />
        <button class="btn-icon" id="saveClubNameBtn" style="color:var(--green);">${ICONS.check}</button>
      </div>
    </div>
    <div>
      <div class="eyebrow">Responsables</div>
      <button class="btn-primary" id="addResponsableBtn" style="margin-bottom:8px;">${ICONS.plus} Ajouter un responsable</button>
      ${responsables.length === 0 ? `<div class="card empty-card">Aucun responsable enregistré.</div>` : `
        <div class="stack-sm">
          ${responsables.map((r) => `
            <div class="card card-pad-sm" style="display:flex;align-items:center;justify-content:space-between;">
              <div><div class="row-title">${esc(r.name)}</div><div style="color:var(--muted2);font-size:12px;">${esc(r.role)}</div></div>
              <button class="btn-icon delete-responsable-btn" data-id="${r.id}">${ICONS.trash}</button>
            </div>`).join("")}
        </div>`}
    </div>
    <div>
      <div class="eyebrow">Sauvegarde des données</div>
      <div class="card card-pad" style="color:var(--muted);font-size:13px;line-height:1.5;margin-bottom:10px;">
        Toutes les données de l'appli sont stockées uniquement sur cet appareil. Exporte régulièrement une sauvegarde pour ne rien perdre si tu changes de téléphone ou vides le cache du navigateur.
      </div>
      <div class="btn-row">
        <button class="btn-primary" id="exportDataBtn" style="flex:1;">${ICONS.download} Exporter mes données</button>
        <button class="btn-ghost" id="importDataBtn" style="flex:1;">Importer une sauvegarde</button>
      </div>
      <input type="file" id="importDataFile" accept="application/json,.json" style="display:none;" />
      <div id="importStatusMsg" style="font-size:12px;color:var(--muted2);margin-top:6px;"></div>
    </div>
  </div>`;
}

function exportBackup() {
  const dataStr = JSON.stringify(STATE, null, 2);
  const blob = new Blob([dataStr], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const dateStr = new Date().toISOString().slice(0, 10);
  const a = document.createElement("a");
  a.href = url;
  a.download = `ziapopofc-sauvegarde-${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importBackup(file) {
  const statusEl = document.getElementById("importStatusMsg");
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!parsed || typeof parsed !== "object" || !Array.isArray(parsed.players)) {
        throw new Error("Format invalide");
      }
      const ok = confirm("Importer cette sauvegarde va remplacer toutes les données actuelles de l'appli. Continuer ?");
      if (!ok) return;
      STATE = parsed;
      saveState();
      statsActiveChampionship = null;
      statsActiveEdition = null;
      compoFormation = "4-3-3"; compoName = ""; compoSlots = {}; compoLoadedId = null;
      render();
    } catch (e) {
      if (statusEl) statusEl.textContent = "Fichier invalide : impossible d'importer cette sauvegarde.";
      else alert("Fichier invalide : impossible d'importer cette sauvegarde.");
    }
  };
  reader.readAsText(file);
}

function openResponsableModal() {
  showModal("Nouveau responsable", `
    <div class="field"><div class="field-label">Nom / pseudo</div><input class="input" id="r_name" /></div>
    <div class="field"><div class="field-label">Rôle</div><input class="input" id="r_role" placeholder="Ex: Président, Manager, Coach" /></div>
    <button class="btn-primary" id="saveResponsableBtn">Ajouter</button>
  `);
  const nameInput = document.getElementById("r_name");
  nameInput.focus();
  document.getElementById("saveResponsableBtn").addEventListener("click", () => {
    const name = nameInput.value.trim();
    const role = document.getElementById("r_role").value.trim();
    if (!name) return;
    STATE.responsables.push({ id: uid(), name, role });
    saveState(); closeModal(); render();
  });
}

/* ---------------------------- Modal ---------------------------- */

function showModal(title, bodyHtml) {
  const root = document.getElementById("modalRoot");
  root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-sheet" id="modalSheet">
        <div class="modal-head">
          <div class="modal-title">${esc(title)}</div>
          <button class="btn-icon" id="modalCloseBtn">${ICONS.x}</button>
        </div>
        ${bodyHtml}
      </div>
    </div>`;
  document.getElementById("modalOverlay").addEventListener("click", (e) => { if (e.target.id === "modalOverlay") closeModal(); });
  document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
}
function closeModal() { document.getElementById("modalRoot").innerHTML = ""; }

/* ---------------------------- Event wiring ---------------------------- */

function attachViewHandlers() {
  document.querySelectorAll(".plus-tile").forEach((btn) => btn.addEventListener("click", () => setTab(btn.dataset.tab)));
  const backBtn = document.getElementById("backToPlus");
  if (backBtn) backBtn.addEventListener("click", () => setTab("plus"));

  if (STATE.tab === "effectif") {
    const search = document.getElementById("effectifSearch");
    if (search) {
      search.addEventListener("input", () => {
        effectifQuery = search.value; render();
        const s2 = document.getElementById("effectifSearch");
        if (s2) { s2.focus(); s2.selectionStart = s2.selectionEnd = s2.value.length; }
      });
    }
    document.querySelectorAll("[data-filter]").forEach((btn) => btn.addEventListener("click", () => { effectifFilter = btn.dataset.filter; render(); }));
    const addBtn = document.getElementById("addPlayerBtn");
    if (addBtn) addBtn.addEventListener("click", () => openPlayerModal(null));
    document.querySelectorAll(".edit-player-btn").forEach((btn) => btn.addEventListener("click", () => openPlayerModal(STATE.players.find((x) => x.id === btn.dataset.id))));
    document.querySelectorAll(".delete-player-btn").forEach((btn) => btn.addEventListener("click", () => {
      STATE.players = STATE.players.filter((x) => x.id !== btn.dataset.id);
      saveState(); render();
    }));
  }

  if (STATE.tab === "compos") {
    document.querySelectorAll("[data-formation]").forEach((btn) => btn.addEventListener("click", () => { compoFormation = btn.dataset.formation; compoSlots = {}; render(); }));
    const nameInput = document.getElementById("compoNameInput");
    if (nameInput) nameInput.addEventListener("input", () => { compoName = nameInput.value; });
    document.querySelectorAll(".slot-btn").forEach((btn) => btn.addEventListener("click", () => openSlotModal(btn.dataset.slot)));
    const saveBtn = document.getElementById("saveCompoBtn");
    if (saveBtn) saveBtn.addEventListener("click", () => {
      const comp = { id: compoLoadedId || uid(), name: compoName.trim() || `Compo ${new Date().toLocaleDateString("fr-FR")}`, formation: compoFormation, slots: compoSlots };
      const idx = STATE.compositions.findIndex((c) => c.id === comp.id);
      if (idx >= 0) STATE.compositions[idx] = comp; else STATE.compositions.push(comp);
      compoLoadedId = comp.id;
      saveState(); render();
    });
    const genBtn = document.getElementById("generateVisualBtn");
    if (genBtn) genBtn.addEventListener("click", generateVisual);
    const newBtn = document.getElementById("newCompoBtn");
    if (newBtn) newBtn.addEventListener("click", () => { compoFormation = "4-3-3"; compoSlots = {}; compoName = ""; compoLoadedId = null; render(); });
    document.querySelectorAll(".load-compo-btn").forEach((el) => el.addEventListener("click", () => {
      const c = STATE.compositions.find((x) => x.id === el.dataset.id);
      if (!c) return;
      compoFormation = c.formation; compoSlots = { ...c.slots }; compoName = c.name; compoLoadedId = c.id;
      render();
    }));
    document.querySelectorAll(".delete-compo-btn").forEach((btn) => btn.addEventListener("click", () => {
      STATE.compositions = STATE.compositions.filter((x) => x.id !== btn.dataset.id);
      if (compoLoadedId === btn.dataset.id) { compoFormation = "4-3-3"; compoSlots = {}; compoName = ""; compoLoadedId = null; }
      saveState(); render();
    }));
  }

  if (STATE.tab === "matchs") {
    const addBtn = document.getElementById("addMatchBtn");
    if (addBtn) addBtn.addEventListener("click", () => openMatchModal(null));
    document.querySelectorAll(".edit-match-btn").forEach((btn) => btn.addEventListener("click", () => openMatchModal(STATE.matches.find((x) => x.id === btn.dataset.id))));
    document.querySelectorAll(".delete-match-btn").forEach((btn) => btn.addEventListener("click", () => {
      STATE.matches = STATE.matches.filter((x) => x.id !== btn.dataset.id);
      saveState(); render();
    }));
  }

  if (STATE.tab === "stats") {
    document.querySelectorAll(".champ-chip").forEach((btn) => btn.addEventListener("click", () => { statsActiveChampionship = btn.dataset.id; statsActiveEdition = null; render(); }));
    document.querySelectorAll(".edition-chip").forEach((btn) => btn.addEventListener("click", () => { statsActiveEdition = btn.dataset.id; render(); }));
    const addChampBtn = document.getElementById("addChampBtn");
    if (addChampBtn) addChampBtn.addEventListener("click", openChampionshipModal);
    const addEditionBtn = document.getElementById("addEditionBtn");
    if (addEditionBtn) addEditionBtn.addEventListener("click", () => openEditionModal(statsActiveChampionship));
    const addEditionBtnBig = document.getElementById("addEditionBtnBig");
    if (addEditionBtnBig) addEditionBtnBig.addEventListener("click", () => openEditionModal(statsActiveChampionship));
    document.querySelectorAll(".delete-champ-btn").forEach((btn) => btn.addEventListener("click", () => {
      const id = btn.dataset.id;
      STATE.championships = STATE.championships.filter((c) => c.id !== id);
      STATE.editions = STATE.editions.filter((e) => e.championshipId !== id);
      Object.keys(STATE.stats).forEach((k) => { if (k.startsWith(id + "::")) delete STATE.stats[k]; });
      statsActiveChampionship = null; statsActiveEdition = null;
      saveState(); render();
    }));
    document.querySelectorAll(".stat-input").forEach((input) => input.addEventListener("change", () => {
      setStatField(statsActiveChampionship, statsActiveEdition, input.dataset.player, input.dataset.field, input.value);
      buildStatsCharts();
    }));
    buildStatsCharts();
  }

  if (STATE.tab === "calendrier") {
    const addBtn = document.getElementById("addEventBtn");
    if (addBtn) addBtn.addEventListener("click", () => openEventModal(null));
    document.querySelectorAll(".edit-event-btn").forEach((btn) => btn.addEventListener("click", () => openEventModal(STATE.events.find((x) => x.id === btn.dataset.id))));
    document.querySelectorAll(".delete-event-btn").forEach((btn) => btn.addEventListener("click", () => {
      STATE.events = STATE.events.filter((x) => x.id !== btn.dataset.id);
      delete STATE.attendance[btn.dataset.id];
      saveState(); render();
    }));
  }

  if (STATE.tab === "presences") {
    document.querySelectorAll(".session-chip").forEach((btn) => btn.addEventListener("click", () => { presenceActiveEventId = btn.dataset.id; render(); }));
    document.querySelectorAll(".presence-btn").forEach((btn) => btn.addEventListener("click", () => {
      const sessionId = presenceActiveEventId;
      if (!sessionId) return;
      STATE.attendance[sessionId] = STATE.attendance[sessionId] || {};
      const current = STATE.attendance[sessionId][btn.dataset.player];
      STATE.attendance[sessionId][btn.dataset.player] = current === btn.dataset.status ? null : btn.dataset.status;
      if (!STATE.attendance[sessionId][btn.dataset.player]) delete STATE.attendance[sessionId][btn.dataset.player];
      saveState(); render();
    }));
  }

  if (STATE.tab === "recrutement") {
    const addBtn = document.getElementById("addTrialBtn");
    if (addBtn) addBtn.addEventListener("click", () => openTrialModal(null));
    document.querySelectorAll(".edit-trial-btn").forEach((btn) => btn.addEventListener("click", () => openTrialModal(STATE.trials.find((x) => x.id === btn.dataset.id))));
    document.querySelectorAll(".delete-trial-btn").forEach((btn) => btn.addEventListener("click", () => {
      STATE.trials = STATE.trials.filter((x) => x.id !== btn.dataset.id);
      saveState(); render();
    }));
  }

  if (STATE.tab === "administration") {
    const addBtn = document.getElementById("addLogBtn");
    if (addBtn) addBtn.addEventListener("click", openLogModal);
    document.querySelectorAll(".delete-log-btn").forEach((btn) => btn.addEventListener("click", () => {
      STATE.adminLog = STATE.adminLog.filter((x) => x.id !== btn.dataset.id);
      saveState(); render();
    }));
  }

  if (STATE.tab === "parametres") {
    const saveBtn = document.getElementById("saveClubNameBtn");
    if (saveBtn) saveBtn.addEventListener("click", () => {
      const val = document.getElementById("settingsClubName").value.trim();
      STATE.clubName = val || "ZIAPOPO FC";
      saveState(); render();
    });
    const addResp = document.getElementById("addResponsableBtn");
    if (addResp) addResp.addEventListener("click", openResponsableModal);
    document.querySelectorAll(".delete-responsable-btn").forEach((btn) => btn.addEventListener("click", () => {
      STATE.responsables = STATE.responsables.filter((x) => x.id !== btn.dataset.id);
      saveState(); render();
    }));
    const exportBtn = document.getElementById("exportDataBtn");
    if (exportBtn) exportBtn.addEventListener("click", exportBackup);
    const importBtn = document.getElementById("importDataBtn");
    const importFile = document.getElementById("importDataFile");
    if (importBtn && importFile) {
      importBtn.addEventListener("click", () => importFile.click());
      importFile.addEventListener("change", () => {
        if (importFile.files && importFile.files[0]) importBackup(importFile.files[0]);
        importFile.value = "";
      });
    }
  }
}

/* ---------------------------- Init ---------------------------- */

try {
  render();
} catch (err) {
  const view = document.getElementById("view");
  if (view) {
    view.innerHTML = `
      <div style="padding:24px;color:#EDEFF3;">
        <div style="font-family:'Oswald',sans-serif;font-size:18px;color:#FF5D6C;margin-bottom:10px;">
          Une erreur a empêché l'affichage de l'appli
        </div>
        <div style="font-size:13px;color:#8B93A1;line-height:1.6;margin-bottom:14px;">
          Fais une capture d'écran de ce message et envoie-la pour que ça soit corrigé.
        </div>
        <div style="background:#12161D;border:1px solid #232A35;border-radius:10px;padding:12px;font-family:monospace;font-size:12px;color:#D4AF37;white-space:pre-wrap;word-break:break-word;">${(err && err.message) ? err.message.replace(/</g, "&lt;") : String(err)}</div>
      </div>`;
  }
  console.error("Erreur au rendu initial :", err);
}
</script>
